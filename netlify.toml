[build]
  command = "npm run build"
  publish = "dist"
  functions = "api/api"

[functions]
  node_bundler = "esbuild"   # ✅ THIS FIXES THE ERROR

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
